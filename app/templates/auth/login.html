{% extends "base.html" %}

{% block title %}Iniciar sesión — TRABAJITOS{% endblock %}

{% block content %}
<section class="seccion auth">
    <div class="contenedor auth__contenedor">
        <div class="auth__card">
            <h1 class="auth__titulo">Iniciá sesión</h1>
            <p class="auth__subtitulo">Entrá a tu cuenta de TRABAJITOS.</p>

            <form method="post" novalidate class="auth__form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" value="{{ correo }}" required autocomplete="email">
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <button type="submit" class="boton boton--acento auth__submit">Iniciar sesión</button>
            </form>

            <p class="auth__alterna">¿Todavía no tenés cuenta? <a href="{{ url_for('auth.registro') }}">Creá una</a></p>
        </div>
    </div>
</section>
{% endblock %}
